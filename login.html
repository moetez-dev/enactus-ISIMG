<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Enactus ISIMG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-wrapper">

        <!-- Left panel: brand -->
        <div class="login-brand">
            <div class="brand-content">
                <a href="index.html" class="back-home flex items-center gap-2 text-sm font-bold opacity-70 hover:opacity-100 mb-8 transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
                </a>
                <div class="login-logo mb-6">
                    <img src="enactuss/557778581_122142310376674747_6015000820039650429_n.jpg" alt="Logo" class="w-20 h-20 rounded-2xl object-cover shadow-2xl border-2 border-yellow-400">
                </div>
                <h1 class="brand-title text-5xl font-black font-heading leading-tight mb-4">Welcome <br><span class="text-yellow-400">Back.</span></h1>
                <p class="brand-subtitle text-gray-400 font-medium">Enter your credentials to access the Enactus ISIMG portal.</p>
            </div>
        </div>

        <!-- Right panel: form -->
        <div class="login-form-container bg-white p-10 md:p-16 flex flex-col justify-center">
            <form id="loginForm" class="max-w-md w-full mx-auto">
                <h2 class="form-title text-3xl font-black font-heading uppercase mb-8">Login</h2>

                <div class="space-y-6">
                    <div class="input-group">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 font-heading">Email Address</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                            <input type="email" id="loginEmail" placeholder="name@example.com" autocomplete="email"
                                class="w-full bg-gray-50 border border-gray-100 p-4 pl-12 rounded-2xl outline-none focus:border-yellow-400 transition text-black font-semibold" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 font-heading">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"
                                class="w-full bg-gray-50 border border-gray-100 p-4 pl-12 rounded-2xl outline-none focus:border-yellow-400 transition text-black font-semibold" required>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end mt-4">
                    <button type="button" id="forgotPassword" class="text-xs font-bold text-gray-400 hover:text-yellow-600 transition">Forgot Password?</button>
                </div>

                <button type="submit" id="loginBtn"
                    class="mt-8 bg-black text-white w-full py-5 rounded-2xl font-black font-heading uppercase tracking-widest text-xs flex items-center justify-center gap-3 hover:bg-yellow-400 hover:text-black transition-all shadow-xl shadow-black/10">
                    Sign In <i data-lucide="log-in" class="w-4 h-4"></i>
                </button>

                <p class="mt-10 text-center text-sm font-medium text-gray-500">
                    Don't have an account? <a href="index.html#contact" class="text-black font-black hover:text-yellow-500 underline underline-offset-4">Apply Now</a>
                </p>
            </form>
        </div>
    </div>

    <!-- SCRIPT LOAD ORDER — CRITICAL
         1. Firebase SDKs
         2. firebase-config.js  ← single init, exports auth + db
         3. toast.js            ← replaces all alert() calls
         4. Page logic
    -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/toast.js"></script>
    <script>
        lucide.createIcons();

        /* ══════════════════════════════════════════
           AUTO-REDIRECT IF ALREADY LOGGED IN
           FIX: Original had no session check — visiting
           login.html while logged in would just show
           the form again. Now it skips to the right page.
           ══════════════════════════════════════════ */
        auth.onAuthStateChanged(async (user) => {
            if (!user) return;
            try {
                const doc = await db.collection('users').doc(user.uid).get();
                if (!doc.exists) return;
                const data = doc.data();
                if (data.role === 'admin') {
                    window.location.href = 'admin.html';
                } else if (data.status === 'approved' || data.status === 'interview') {
                    window.location.href = 'member.html';
                }
            } catch (err) {
                console.warn('Session check failed:', err.message);
            }
        });

        /* ══════════════════════════════════════════
           LOGIN FORM
           FIX 1: Removed inline firebase.initializeApp() —
                  firebase-config.js handles the single init.
           FIX 2: All alert() replaced with Toast.
           FIX 3: Button disabled during submit (no double-submit).
           FIX 4: Firebase error codes → friendly messages.
           FIX 5: Button icon restored + re-rendered after submit.
           ══════════════════════════════════════════ */
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email    = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn      = document.getElementById('loginBtn');

            if (!email || !password) {
                Toast.warning('Please enter your email and password.');
                return;
            }

            // Disable button — prevents double-submit while request is in flight
            btn.disabled  = true;
            btn.innerHTML = '<span>Authenticating...</span>';

            try {
                // Step 1: Firebase Auth sign-in
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;

                // Step 2: Fetch Firestore profile (role + status)
                const userDoc = await db.collection('users').doc(uid).get();

                if (!userDoc.exists) {
                    // Auth exists but no Firestore document — shouldn't happen normally
                    Toast.error('Profile data not found. Please contact the admin.');
                    await auth.signOut();
                    return;
                }

                const userData = userDoc.data();

                // Step 3: Route based on role / status
                if (userData.role === 'admin') {
                    Toast.success('Welcome back, Admin! Redirecting...');
                    setTimeout(() => window.location.href = 'admin.html', 800);

                } else if (userData.status === 'approved' || userData.status === 'interview') {
                    // FIX: Toast replaces alert() — personalized with first name
                    const firstName = userData.fullName
                        ? userData.fullName.split(' ')[0]
                        : 'Enactor';
                    Toast.success(`Welcome back, ${firstName}! 🎉`);
                    setTimeout(() => window.location.href = 'member.html', 800);

                } else {
                    // Pending / rejected — sign out and show message
                    // FIX: Toast replaces raw alert("Application Pending: ...")
                    Toast.warning('Your application is still under review. Our HR team will reach out to you soon!');
                    await auth.signOut();
                }

            } catch (err) {
                // FIX: Map Firebase error codes to friendly sentences.
                // Original: alert("Login Error: " + err.message)
                // which showed raw strings like "INVALID_LOGIN_CREDENTIALS" to the user.
                const errorMessages = {
                    'auth/user-not-found':        'No account found with this email address.',
                    'auth/wrong-password':         'Incorrect password. Please try again.',
                    'auth/invalid-email':          'Please enter a valid email address.',
                    'auth/invalid-credential':     'Invalid email or password. Please check and try again.',
                    'auth/too-many-requests':      'Too many failed attempts. Please wait a few minutes and try again.',
                    'auth/user-disabled':          'This account has been disabled. Please contact the admin.',
                    'auth/network-request-failed': 'Network error. Please check your internet connection.',
                };
                Toast.error(errorMessages[err.code] || 'Login failed. Please try again.');

            } finally {
                // Always restore the button — whether login succeeded or failed
                btn.disabled  = false;
                btn.innerHTML = 'Sign In <i data-lucide="log-in" class="w-4 h-4"></i>';
                lucide.createIcons(); // re-render the icon inside the button
            }
        });

        /* ══════════════════════════════════════════
           FORGOT PASSWORD
           FIX: All 3 alert() calls replaced with Toast.
           ══════════════════════════════════════════ */
        document.getElementById('forgotPassword').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();

            if (!email) {
                // FIX: Toast replaces alert("Please enter your email address first.")
                Toast.warning('Type your email in the field above first, then click "Forgot Password".');
                return;
            }

            try {
                await auth.sendPasswordResetEmail(email);
                // FIX: Toast replaces alert("Password reset link sent! ...")
                Toast.success('Password reset link sent! Check your inbox (and spam folder).');
            } catch (err) {
                // FIX: Toast replaces alert("Error: " + err.message)
                const isNotFound = err.code === 'auth/user-not-found' || err.code === 'auth/invalid-email';
                Toast.error(
                    isNotFound
                        ? 'No account found with that email address.'
                        : 'Could not send reset email. Please try again.'
                );
            }
        });
    </script>
</body>
</html>
