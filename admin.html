<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enactus Hub | Admin Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --enactus-yellow: #FFC222; }
        body { font-family: 'Source Sans 3', sans-serif; background: #f8fafc; }
        .font-heading { font-family: 'Montserrat', sans-serif; }
        .sidebar-link.active { background: var(--enactus-yellow); color: black; }
        .section-content { display: none; animation: slideUp 0.3s ease-out; }
        .section-content.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-72 bg-black text-white p-8 flex flex-col fixed h-full z-50">
        <div class="mb-12 flex items-center gap-3">
            <div class="w-10 h-10 bg-yellow-400 rounded-2xl flex items-center justify-center italic font-black text-black text-xl">A</div>
            <h1 class="font-heading text-xl tracking-tighter uppercase">Admin<span class="text-yellow-400 italic">Panel</span></h1>
        </div>

        <nav class="space-y-3 flex-1">
            <button onclick="showSection('reviews', this)" class="sidebar-link active w-full text-left p-4 rounded-2xl transition-all font-bold flex items-center gap-3 opacity-70 hover:opacity-100">
                <i data-lucide="clipboard-check"></i> Submissions
            </button>
            <button onclick="showSection('members', this)" class="sidebar-link w-full text-left p-4 rounded-2xl transition-all font-bold flex items-center gap-3 opacity-70 hover:opacity-100">
                <i data-lucide="users"></i> Members
            </button>
            <button onclick="showSection('tasks', this)" class="sidebar-link w-full text-left p-4 rounded-2xl transition-all font-bold flex items-center gap-3 opacity-70 hover:opacity-100">
                <i data-lucide="plus-square"></i> Assign Mission
            </button>
            <button onclick="showSection('projects', this)" class="sidebar-link w-full text-left p-4 rounded-2xl transition-all font-bold flex items-center gap-3 opacity-70 hover:opacity-100">
                <i data-lucide="rocket"></i> Hub Projects
            </button>
            <button onclick="showSection('calendar', this)" class="sidebar-link w-full text-left p-4 rounded-2xl transition-all font-bold flex items-center gap-3 opacity-70 hover:opacity-100">
                <i data-lucide="calendar"></i> Timeline
            </button>
            <button onclick="showSection('broadcast', this)" class="sidebar-link w-full text-left p-4 rounded-2xl transition-all font-bold flex items-center gap-3 opacity-70 hover:opacity-100">
                <i data-lucide="megaphone"></i> Broadcast
            </button>
        </nav>

        <button onclick="logout()" class="p-4 text-red-400 font-black uppercase text-xs tracking-widest flex items-center gap-3 mt-auto">
            <i data-lucide="log-out"></i> Sign Out
        </button>
    </aside>

    <main class="flex-1 ml-72 p-12">

        <!-- ── Review Submissions ── -->
        <section id="reviewsSection" class="section-content active space-y-8">
            <div class="flex justify-between items-end">
                <h2 class="text-4xl font-black font-heading uppercase italic underline decoration-blue-500 decoration-8">Review Work</h2>
                <span class="text-xs font-bold text-gray-400 uppercase italic">Pending Submissions</span>
            </div>
            <div id="submissionsList" class="grid gap-6"></div>
        </section>

        <!-- ── Members Management ── -->
        <section id="membersSection" class="section-content space-y-8">
            <h2 class="text-4xl font-black font-heading uppercase italic underline decoration-purple-500 decoration-8">Members</h2>
            <div id="membersList" class="grid gap-6"></div>
        </section>

        <!-- ── Assign Mission ── -->
        <section id="tasksSection" class="section-content space-y-8">
            <h2 class="text-4xl font-black font-heading uppercase italic underline decoration-yellow-400 decoration-8">New Mission</h2>
            <div class="bg-white p-10 rounded-[3rem] shadow-2xl border border-gray-100 max-w-2xl">
                <div class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-gray-400 mb-2 ml-2">Target Enactor</label>
                        <select id="taskMember" class="w-full p-5 bg-gray-50 rounded-[1.5rem] font-bold border-2 border-transparent focus:border-yellow-400 outline-none transition"></select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-gray-400 mb-2 ml-2">Mission Description</label>
                        <input type="text" id="taskText" placeholder="e.g. Design 3 Instagram Posts" class="w-full p-5 bg-gray-50 rounded-[1.5rem] font-bold border-2 border-transparent focus:border-yellow-400 outline-none transition">
                    </div>
                    <button onclick="assignTask()" class="w-full py-5 bg-black text-white rounded-[1.5rem] font-black uppercase tracking-widest hover:bg-yellow-400 hover:text-black transition transform active:scale-95">Deploy Mission</button>
                </div>
            </div>
        </section>

        <!-- ── Hub Projects ── -->
        <section id="projectsSection" class="section-content space-y-8">
            <h2 class="text-4xl font-black font-heading uppercase italic underline decoration-green-400 decoration-8">Project Hub</h2>
            <div class="bg-white p-10 rounded-[3rem] shadow-2xl border border-gray-100 max-w-2xl">
                <div class="space-y-6">
                    <input type="text"   id="pName"     placeholder="Project Name"  class="w-full p-5 bg-gray-50 rounded-[1.5rem] font-bold outline-none">
                    <div class="flex items-center gap-4">
                        <input type="number" id="pProgress" placeholder="Progress %" class="flex-1 p-5 bg-gray-50 rounded-[1.5rem] font-bold outline-none" min="0" max="100">
                        <span class="font-black text-xl">%</span>
                    </div>
                    <button onclick="updateProject()" class="w-full py-5 bg-black text-white rounded-[1.5rem] font-black uppercase tracking-widest hover:bg-green-400 transition">Update Member Hub</button>
                </div>
            </div>
        </section>

        <!-- ── Events Planner ── -->
        <section id="calendarSection" class="section-content space-y-8">
            <h2 class="text-4xl font-black font-heading uppercase italic underline decoration-orange-400 decoration-8">Events Planner</h2>
            <div class="bg-white p-10 rounded-[3rem] shadow-2xl border border-gray-100 max-w-2xl">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text"     id="eDate"  placeholder="Date (e.g. 20 MAR)"  class="p-5 bg-gray-50 rounded-[1.5rem] font-bold outline-none">
                    <input type="text"     id="eTitle" placeholder="Event Name"           class="p-5 bg-gray-50 rounded-[1.5rem] font-bold outline-none">
                    <textarea             id="eDesc"  placeholder="Event Details..."     class="col-span-2 p-5 bg-gray-50 rounded-[1.5rem] h-32 font-bold outline-none"></textarea>
                    <button onclick="addEvent()" class="col-span-2 py-5 bg-black text-white rounded-[1.5rem] font-black uppercase tracking-widest hover:bg-orange-400 transition">Schedule Event</button>
                </div>
            </div>
        </section>

        <!-- ── Broadcast ── -->
        <section id="broadcastSection" class="section-content space-y-8">
            <h2 class="text-4xl font-black font-heading uppercase italic underline decoration-red-400 decoration-8">Club News</h2>
            <div class="bg-white p-10 rounded-[3rem] shadow-2xl border border-gray-100 max-w-2xl">
                <div class="space-y-6">
                    <input type="text" id="nTitle" placeholder="Announcement Title"   class="w-full p-5 bg-gray-50 rounded-[1.5rem] font-bold outline-none">
                    <textarea         id="nDesc"  placeholder="Content..."           class="w-full p-5 bg-gray-50 rounded-[1.5rem] h-32 font-bold outline-none"></textarea>
                    <button onclick="publishNews()" class="w-full py-5 bg-black text-white rounded-[1.5rem] font-black uppercase tracking-widest hover:bg-red-500 transition">Broadcast Globally</button>
                </div>
            </div>
        </section>

    </main>

    <!-- SCRIPT LOAD ORDER — CRITICAL
         1. Firebase SDKs
         2. firebase-config.js  ← single init, exports auth + db
         3. toast.js
         4. Page logic + AuthGuard
    -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/toast.js"></script>

    <script>
        /* auth and db come from firebase-config.js — no duplicate init here */
        lucide.createIcons();

        /* ══ AUTH GUARD — admin only ══
           Redirect non-admins before any data is loaded.
        */
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }

            try {
                const doc = await db.collection('users').doc(user.uid).get();
                if (!doc.exists || doc.data().role !== 'admin') {
                    /* Not an admin — kick to member page */
                    window.location.href = 'member.html';
                    return;
                }
                /* Admin confirmed — boot the panel */
                initAdminPanel();
            } catch (err) {
                console.error('Auth guard error:', err);
                window.location.href = 'login.html';
            }
        });

        /* ══ SECTION SWITCHER ══ */
        function showSection(id, btn) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id + 'Section').classList.add('active');
            btn.classList.add('active');
        }

        /* ══ PANEL INIT — only called after admin role is confirmed ══ */
        function initAdminPanel() {
            loadMemberDropdown();
            loadSubmissions();
            loadMembersList();
        }

        /* ══ MEMBER DROPDOWN (Assign Mission) ══ */
        function loadMemberDropdown() {
            db.collection('users').onSnapshot(snap => {
                const select = document.getElementById('taskMember');
                select.innerHTML = '';

                const placeholder = document.createElement('option');
                placeholder.value       = '';
                placeholder.textContent = '-- Choose Member --';
                select.appendChild(placeholder);

                snap.forEach(doc => {
                    const u = doc.data();
                    if (u.role === 'admin') return;

                    const opt = document.createElement('option');
                    opt.value       = doc.id;
                    /* textContent prevents injected HTML in option labels */
                    opt.textContent = `${u.fullName || 'Unknown'} (${u.department || 'No Dept'})`;
                    select.appendChild(opt);
                });
            });
        }

        /* ══ REVIEW SUBMISSIONS ══ */
        function loadSubmissions() {
            db.collection('tasks').where('status', '==', 'pending_review').onSnapshot(snap => {
                const list = document.getElementById('submissionsList');
                list.innerHTML = '';

                if (snap.empty) {
                    const msg = document.createElement('p');
                    msg.className   = 'font-bold text-gray-400 italic';
                    msg.textContent = 'No submissions to review right now.';
                    list.appendChild(msg);
                    return;
                }

                snap.forEach(doc => {
                    const t = doc.data();

                    /* Fetch the submitting user's profile */
                    db.collection('users').doc(t.uid).get().then(uDoc => {
                        if (!uDoc.exists) return;
                        const u = uDoc.data();

                        /* ── Card ── */
                        const card = document.createElement('div');
                        card.className = 'bg-white p-8 rounded-[2.5rem] shadow-xl border-l-8 border-blue-500 flex justify-between items-center';

                        /* Left: avatar + info */
                        const left = document.createElement('div');
                        left.className = 'flex items-center gap-6';

                        const avatar = document.createElement('img');
                        avatar.src       = u.profilePic || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.fullName || 'U')}`;
                        avatar.className = 'w-16 h-16 rounded-2xl object-cover';

                        const info = document.createElement('div');

                        const memberName = document.createElement('p');
                        memberName.className   = 'text-[10px] font-black text-blue-500 uppercase tracking-widest';
                        memberName.textContent = u.fullName || '';   /* ✅ textContent */

                        const taskTitle = document.createElement('h4');
                        taskTitle.className   = 'text-xl font-black italic uppercase';
                        taskTitle.textContent = t.text || '';   /* ✅ textContent */

                        /* Work link — only allow http/https URLs */
                        const workLink = document.createElement('a');
                        const safeLink = /^https?:\/\//i.test(t.workLink || '') ? t.workLink : '#';
                        workLink.href      = safeLink;
                        workLink.target    = '_blank';
                        workLink.rel       = 'noopener noreferrer';
                        workLink.className = 'text-xs text-blue-400 underline font-bold italic';
                        workLink.textContent = 'Click to view work';

                        info.appendChild(memberName);
                        info.appendChild(taskTitle);
                        info.appendChild(workLink);
                        left.appendChild(avatar);
                        left.appendChild(info);

                        /* Right: approve / reject buttons */
                        const btnGroup = document.createElement('div');
                        btnGroup.className = 'flex gap-3';

                        const approveBtn = document.createElement('button');
                        approveBtn.className   = 'bg-green-500 text-white px-8 py-4 rounded-2xl font-black uppercase text-xs hover:bg-black transition shadow-lg shadow-green-200';
                        approveBtn.textContent = 'Approve & +50';
                        approveBtn.addEventListener('click', () => approveWork(doc.id, t.uid));

                        const rejectBtn = document.createElement('button');
                        rejectBtn.className   = 'bg-red-100 text-red-500 px-8 py-4 rounded-2xl font-black uppercase text-xs hover:bg-red-500 hover:text-white transition';
                        rejectBtn.textContent = 'Reject';
                        rejectBtn.addEventListener('click', () => rejectWork(doc.id));

                        btnGroup.appendChild(approveBtn);
                        btnGroup.appendChild(rejectBtn);

                        card.appendChild(left);
                        card.appendChild(btnGroup);
                        list.appendChild(card);
                    });
                });
            });
        }

        /* ══ MEMBERS LIST (with approve/reject pending applications) ══ */
        function loadMembersList() {
            db.collection('users').onSnapshot(snap => {
                const list = document.getElementById('membersList');
                list.innerHTML = '';

                snap.forEach(doc => {
                    const u = doc.data();
                    if (u.role === 'admin') return;

                    const card = document.createElement('div');
                    card.className = 'bg-white p-6 rounded-[2rem] shadow-md border border-gray-100 flex justify-between items-center';

                    const info = document.createElement('div');
                    info.className = 'flex items-center gap-4';

                    const avatar = document.createElement('img');
                    avatar.src       = u.profilePic || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.fullName || 'U')}`;
                    avatar.className = 'w-12 h-12 rounded-xl object-cover';

                    const details = document.createElement('div');

                    const nameEl = document.createElement('p');
                    nameEl.className   = 'font-black uppercase text-sm';
                    nameEl.textContent = u.fullName || '';

                    const deptEl = document.createElement('p');
                    deptEl.className   = 'text-[10px] text-gray-400 font-bold uppercase';
                    deptEl.textContent = `${u.department || 'N/A'} • ${u.status || 'pending'}`;

                    details.appendChild(nameEl);
                    details.appendChild(deptEl);
                    info.appendChild(avatar);
                    info.appendChild(details);

                    const actions = document.createElement('div');
                    actions.className = 'flex gap-2';

                    if (u.status === 'pending') {
                        const approveBtn = document.createElement('button');
                        approveBtn.className   = 'bg-green-500 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-black transition';
                        approveBtn.textContent = 'Approve';
                        approveBtn.addEventListener('click', () => approveMember(doc.id));

                        const rejectBtn = document.createElement('button');
                        rejectBtn.className   = 'bg-red-100 text-red-500 px-4 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-red-500 hover:text-white transition';
                        rejectBtn.textContent = 'Reject';
                        rejectBtn.addEventListener('click', () => rejectMember(doc.id));

                        actions.appendChild(approveBtn);
                        actions.appendChild(rejectBtn);
                    }

                    card.appendChild(info);
                    card.appendChild(actions);
                    list.appendChild(card);
                });
            });
        }

        /* ══ APPROVE / REJECT WORK ══ */
        async function approveWork(tId, uId) {
            try {
                await db.collection('tasks').doc(tId).update({ status: 'approved', completed: true });
                const userRef = db.collection('users').doc(uId);
                const user    = await userRef.get();
                await userRef.update({ points: (user.data().points || 0) + 50 });
                Toast.success('Mission validated! Member received 50 points.');
            } catch (err) {
                Toast.error('Could not approve work. Please try again.');
                console.error(err);
            }
        }

        async function rejectWork(id) {
            try {
                await db.collection('tasks').doc(id).update({ status: 'live', submitted: false });
                Toast.warning('Work rejected. Member can re-submit.');
            } catch (err) {
                Toast.error('Could not reject work. Please try again.');
                console.error(err);
            }
        }

        /* ══ APPROVE / REJECT MEMBER APPLICATIONS ══ */
        async function approveMember(uid) {
            try {
                await db.collection('users').doc(uid).update({ status: 'approved' });
                Toast.success('Member approved!');
            } catch (err) {
                Toast.error('Could not approve member.');
            }
        }

        async function rejectMember(uid) {
            try {
                await db.collection('users').doc(uid).update({ status: 'rejected' });
                Toast.warning('Member application rejected.');
            } catch (err) {
                Toast.error('Could not reject member.');
            }
        }

        /* ══ ASSIGN TASK ══ */
        async function assignTask() {
            const uid  = document.getElementById('taskMember').value;
            const text = document.getElementById('taskText').value.trim();

            if (!uid || !text) {
                Toast.warning('Select a member and write the mission first!');
                return;
            }

            try {
                await db.collection('tasks').add({
                    uid,
                    text,
                    completed:  false,
                    submitted:  false,
                    status:     'live',
                    createdAt:  firebase.firestore.FieldValue.serverTimestamp()
                });
                Toast.success('Mission deployed!');
                document.getElementById('taskText').value = '';
            } catch (err) {
                Toast.error('Could not deploy mission. Please try again.');
                console.error(err);
            }
        }

        /* ══ UPDATE PROJECT ══ */
        async function updateProject() {
            const name     = document.getElementById('pName').value.trim();
            const progress = parseInt(document.getElementById('pProgress').value, 10);

            if (!name || isNaN(progress)) {
                Toast.warning('Please enter a project name and a valid progress value.');
                return;
            }

            try {
                await db.collection('projects').doc(name.toLowerCase().replace(/\s+/g, '-')).set({
                    name,
                    progress: Math.min(100, Math.max(0, progress))
                });
                Toast.success('Hub updated!');
            } catch (err) {
                Toast.error('Could not update project.');
                console.error(err);
            }
        }

        /* ══ ADD EVENT ══ */
        async function addEvent() {
            const date  = document.getElementById('eDate').value.trim();
            const title = document.getElementById('eTitle').value.trim();
            const desc  = document.getElementById('eDesc').value.trim();

            if (!date || !title) {
                Toast.warning('Date and title are required.');
                return;
            }

            try {
                await db.collection('events').add({
                    date,
                    title,
                    description: desc,
                    createdAt:   firebase.firestore.FieldValue.serverTimestamp()
                });
                Toast.success('Event published!');
                document.getElementById('eDate').value  = '';
                document.getElementById('eTitle').value = '';
                document.getElementById('eDesc').value  = '';
            } catch (err) {
                Toast.error('Could not publish event.');
                console.error(err);
            }
        }

        /* ══ PUBLISH NEWS ══ */
        async function publishNews() {
            const title = document.getElementById('nTitle').value.trim();
            const desc  = document.getElementById('nDesc').value.trim();

            if (!title || !desc) {
                Toast.warning('Title and content are required.');
                return;
            }

            try {
                await db.collection('news').add({
                    title,
                    desc,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                Toast.success('Broadcast sent!');
                document.getElementById('nTitle').value = '';
                document.getElementById('nDesc').value  = '';
            } catch (err) {
                Toast.error('Could not broadcast. Please try again.');
                console.error(err);
            }
        }

        /* ══ LOGOUT ══ */
        function logout() {
            auth.signOut().then(() => window.location.href = 'login.html');
        }
    </script>
</body>
</html>
